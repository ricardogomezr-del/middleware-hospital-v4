services:
  - type: web
    name: middleware-hospital-v4
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: HOSPITAL_USER
        sync: false
      - key: HOSPITAL_PASSWORD
        sync: false
